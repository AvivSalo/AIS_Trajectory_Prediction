# GAT-LSTM method config
# Reference: Zhao et al. (2023), Ocean Engineering 289, 116159
# https://doi.org/10.1016/j.oceaneng.2023.116159
model_name: gat_lstm

# ---- GAT architecture ----
in_features: 4          # node features: x, y, vx, vy (channels 0-3 of obj_trajs)
gat_hidden: 32          # output dim per attention head
num_heads: 4            # K independent attention heads (Eq. 8)
num_gat_layers: 2       # stacked GAT layers

# ---- LSTM architecture ----
lstm_hidden: 128        # LSTM hidden state size
lstm_layers: 2          # stacked LSTM layers

# ---- Regularization ----
dropout: 0.3

# ---- UniTraj interface ----
num_modes: 1            # deterministic single-mode prediction
use_map_image: False
use_map_lanes: False

# ---- Data config (must match top-level config) ----
num_agent_feature: 39
num_map_feature: 1
max_num_agents: 10
map_range: 22000
position_scale: 100.0
velocity_scale: 20.0
max_num_roads: 1
max_points_per_lane: 1
manually_split_lane: False
point_sampled_interval: 1
num_points_each_polyline: 1
vector_break_dist_thresh: 1.0

# ---- Training ----
max_epochs: 100
learning_rate: 0.001
learning_rate_sched: [80, 90]
optimizer: Adam
weight_decay: 0.0001
grad_clip_norm: 5
train_batch_size: 32
eval_batch_size: 64