# AIS Marine Traffic Wayformer Configuration
model_name: wayformer_ais

# model
use_map_image: False
use_map_lanes: False
num_modes: 6
num_agent_feature: 39
num_map_feature: 1
hidden_size: 256
num_encoder_layers: 2
num_decoder_layers: 8
tx_hidden_size: 1024
tx_num_heads: 4
dropout: 0.1
entropy_weight: 40.0
kl_weight: 20.0
use_FDEADE_aux_loss: True
num_queries_dec: 64
num_queries_enc: 192

# train
max_epochs: 100
learning_rate: 0.001
learning_rate_sched: [ 80, 90 ]
optimizer: AdamW
scheduler: multistep
ewc_lambda: 2000
grad_clip_norm: 10
train_batch_size: 16
eval_batch_size: 16

# data related
max_num_agents: 10
map_range: 22000
position_scale: 100.0
velocity_scale: 20.0
max_num_roads: 1
max_points_per_lane: 1
manually_split_lane: False
point_sampled_interval: 1
num_points_each_polyline: 1
vector_break_dist_thresh: 1.0

# AIS-specific
coordinate_system: "relative"
interpolation_method: "linear"
max_interpolation_gap: 2.0
vessel_types: ["cargo", "tanker", "container", "bulk", "other"]
