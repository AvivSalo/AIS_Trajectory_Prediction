# =============================================================================
# AIS-ACNet training config — mirrors config_traisformer_ec2.yaml's data
# settings so reported numbers compare apples-to-apples on the same dataset.
#
# The data pipeline is intentionally IDENTICAL to the Wayformer-AIS 5-min run
# and TrAISformer run so all baselines are evaluated on the same splits.
# =============================================================================

# exp setting
exp_name: 'ais_acnet_5min_v1'
ckpt_path: null
seed: 42
debug: False
devices: [ 0 ]
normalize_data: True

# data related — same paths/horizons as Wayformer and TrAISformer EC2 runs
load_num_workers: 6
train_data_path: [ "/home/ubuntu/projects/AIS_Trajectory_Prediction/unitraj/data/processed_ais_4hours_optimized/train" ]
val_data_path: [ "/home/ubuntu/projects/AIS_Trajectory_Prediction/unitraj/data/processed_ais_4hours_optimized/val" ]
cache_path: "./cache_5min"
max_data_num: [ 100 ]
starting_frame: [ 0 ]
past_len: 300                      # 5 min history @ 1 Hz
future_len: 300                    # 5 min prediction @ 1 Hz
stride: 300                        # non-overlapping windows
object_type: [ 'VESSEL' ]
line_type: [ ]
masked_attributes: [ 'z_axis', 'size' ]
trajectory_sample_interval: 1
only_train_on_ego: False
center_offset_of_map: [ 0.0, 0.0 ]
use_cache: True
overwrite_cache: True
store_data_in_memory: False

# official evaluation (not applicable for AIS)
nuscenes_dataroot: ''
eval_nuscenes: False
eval_waymo: False
eval_argoverse2: False

# AIS-ACNet's dual-encoder has auxiliary-network params that are decoupled from
# the main-net skip in some forward passes, triggering DDP's unused-param check.
ddp_strategy: ddp_find_unused_parameters_true

defaults:
  - method: ais_acnet
