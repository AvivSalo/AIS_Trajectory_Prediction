# =============================================================================
# GAT-LSTM training config — mirrors config_ais_acnet_ec2.yaml data settings
# so reported numbers compare apples-to-apples on the same dataset and splits.
#
# Architecture reference:
#   Zhao et al. (2023) "A ship trajectory prediction method based on GAT and LSTM"
#   Ocean Engineering 289, 116159.  https://doi.org/10.1016/j.oceaneng.2023.116159
#
# Paper hyperparameters (Section 4.1):
#   - Adam, lr=0.001, N_nodes=10 (matches max_num_agents below)
#   - K=4 attention heads, GAT hidden=32, LSTM hidden=128 (standard for GAT-LSTM)
# =============================================================================

# exp setting
exp_name: 'gat_lstm_5min_v1'
ckpt_path: null
seed: 42
debug: False
devices: [ 0 ]
normalize_data: True

# data — identical to TrAISformer and AIS-ACNet EC2 runs
load_num_workers: 6
train_data_path: [ "/home/ubuntu/projects/AIS_Trajectory_Prediction/unitraj/data/processed_ais_4hours_optimized/train" ]
val_data_path: [ "/home/ubuntu/projects/AIS_Trajectory_Prediction/unitraj/data/processed_ais_4hours_optimized/val" ]
cache_path: "./cache_5min"
max_data_num: [ 100 ]
starting_frame: [ 0 ]
past_len: 300                      # 5 min history @ 1 Hz
future_len: 300                    # 5 min prediction @ 1 Hz
stride: 300                        # non-overlapping windows
object_type: [ 'VESSEL' ]
line_type: [ ]
masked_attributes: [ 'z_axis', 'size' ]
trajectory_sample_interval: 1
only_train_on_ego: False
center_offset_of_map: [ 0.0, 0.0 ]
use_cache: True
overwrite_cache: True
store_data_in_memory: False

# official evaluation (not applicable for AIS)
nuscenes_dataroot: ''
eval_nuscenes: False
eval_waymo: False
eval_argoverse2: False

defaults:
  - method: gat_lstm
